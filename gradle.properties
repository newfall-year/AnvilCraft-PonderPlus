org.gradle.jvmargs=-Xmx2G

# Minecraft / NeoForge（两值必须对应同一 MC 版本）
minecraft_version=1.21.1
neo_version=21.1.249

# 依赖版本区间（neoforge.mods.toml 的 dependencies 用）
minecraft_version_range=[1.21.1]
neo_version_range=[21.1,)

# Ponder（思索库）版本：maven.createmod.net 上 Ponder-NeoForge-1.21.1 的 1.0.69 为 2025-11 最新
ponder_version=1.0.69
# Flywheel 渲染库（Ponder 的 CLIENT 端必需依赖）；只用到 API 工件
flywheel_version=1.0.6
# dev 运行期要加载的两个 mod（发布 jar 不依赖它们，见 build.gradle）
# AnvilCraft 的快照号就是 build 号：>=2650 用 snapshot.2657（2026-10 最新）
anvilcraft_version=1.6.0+snapshot.2657
# 与 AnvilCraft 1.6.0+snapshot.2657 的 pom 声明配对（2.0.0 线与 1.4.0 不兼容）
anvillib_version=2.0.0+snapshot.550
ageratum_version=0.0.1+build.121

# Mod metadata（mod_id 与 @Mod 注解必须一致；mod_id 只允许 [a-z][a-z0-9_]{1,63}）
# 注意：本文件必须保持纯 ASCII——Gradle 按 ISO-8859-1 读 properties，中文会变成乱码。
# 显示名和中文简介都写死在 META-INF/neoforge.mods.toml 里，那两行只是占位/备用值。
mod_id=anvilcraft_ponder_plus
mod_name=AnvilCraft Ponder Plus
mod_version=0.1.0
mod_group_id=dev.anvilcraft.ponder
mod_authors=YourName
mod_license=LGPL-3.0-or-later
mod_description=Ponder scenes for AnvilCraft
