plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// 仓库统一在 settings.gradle 的 dependencyResolutionManagement 里声明（含 NeoForged 镜像）。

dependencies {
    // ── 编译期 ────────────────────────────────────────────────────────────────
    // 只用到 Ponder 的 API；Ponder / Flywheel 由玩家自己装，我们的 jar 不打包它们。
    compileOnly "net.createmod.ponder:Ponder-NeoForge-${minecraft_version}:${ponder_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"

    // ── dev 运行期（runClient 里要真的加载这三个 mod，才能长按 W 看到思索）──
    // runtimeOnly = 只进运行时 classpath：不参与编译，也不进发布 pom 的编译依赖。
    // 不需要在 dev 里跑它们时，整段删掉即可，正式 jar 不受影响。
    // AnvilCraft 用 transitive = false（和官方附属模板一致）：它的 pom 里那些
    // compile 依赖（Registrate/JEI…）在 dev 里不需要，带着反而拉不到/拖慢解析。
    runtimeOnly "net.createmod.ponder:Ponder-NeoForge-${minecraft_version}:${ponder_version}"
    runtimeOnly("dev.dubhe:anvilcraft-neoforge-${minecraft_version}:${anvilcraft_version}") { transitive = false }
    runtimeOnly "dev.anvilcraft.lib:anvillib-neoforge-${minecraft_version}:${anvillib_version}"
    runtimeOnly "dev.anvilcraft.resource:ageratum-neoforge-${minecraft_version}:${ageratum_version}"
}

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// runData 输出挂进资源源集，随 jar 打包（勿手动改 generated 文件）。
sourceSets.main.resources { srcDir 'src/generated/resources' }

// 只在 neoforge.mods.toml 上做占位符展开，其它资源文件原样复制。
// 注意：expand 底层是 Groovy 模板引擎，会把它看到的任何“美元号+花括号”片段
// 当作表达式求值——资源文件里出现非占位符的该类写法会让构建以模板解析失败报错。
processResources {
    filesMatching('META-INF/neoforge.mods.toml') {
        expand project.properties
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
